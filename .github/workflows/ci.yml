name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # The ONNX bundle is pinned into a Docker layer rather than fetched from
      # HuggingFace during the run. Previously a cache miss downloaded ~130MB
      # inside a test, blowing its 120s timeout and starving the runner — which
      # then tripped unrelated tests with short timeouts (admin HTTP, adapters).
      # Layer caching is keyed on the model spec, not on actions/cache, so it is
      # neither subject to that quota's LRU eviction nor to branch scoping.
      - uses: docker/setup-buildx-action@v4
      - name: Build pinned ONNX model bundle
        uses: docker/build-push-action@v7
        with:
          context: .
          target: models-export
          platforms: linux/amd64
          cache-from: type=gha,scope=models
          cache-to: type=gha,mode=max,scope=models
          outputs: type=local,dest=${{ runner.temp }}/models-export
      - name: Stage model bundle where tests expect it
        run: |
          mv "${{ runner.temp }}/models-export/models" ./.models
          du -sh ./.models
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run build
      - name: Validate JSON Schema
        run: bun -e 'JSON.parse(await Bun.file("docs/schema.json").text())'

  docker-slim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: slim
          platforms: linux/amd64
          push: false
          load: true
          tags: skillmux:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test slim Docker runtime contract
        run: bash tests/docker-smoke.sh skillmux:ci
