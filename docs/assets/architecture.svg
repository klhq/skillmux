<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Skillmux skill management and retrieval architecture</title>
  <desc id="desc">A canonical skill vault feeds native core and project skill directories through sync, and routed skills through lexical, embedding, and reranked MCP retrieval.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="vault" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="native" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <style>
      .heading { font: 700 22px system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .subheading { font: 700 16px system-ui, -apple-system, sans-serif; fill: #f8fafc; }
      .label { font: 600 13px system-ui, -apple-system, sans-serif; fill: #e2e8f0; }
      .body { font: 12px system-ui, -apple-system, sans-serif; fill: #a8b3c7; }
      .mono { font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e2e8f0; }
      .chip { font: 700 11px system-ui, -apple-system, sans-serif; fill: #f8fafc; letter-spacing: .4px; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="20" fill="url(#background)"/>
  <path d="M0 88H1200 M0 532H1200" stroke="#243047" stroke-width="1"/>
  <text x="48" y="48" class="heading">Skillmux</text>
  <text x="48" y="72" class="body">One skill vault, two delivery paths</text>

  <g filter="url(#shadow)">
    <rect x="390" y="116" width="420" height="170" rx="18" fill="url(#vault)" stroke="#93c5fd" stroke-opacity=".35"/>
    <rect x="418" y="140" width="102" height="24" rx="12" fill="#0b1020" fill-opacity=".45"/>
    <text x="469" y="157" text-anchor="middle" class="chip">SOURCE</text>
    <text x="418" y="195" class="heading">Canonical skill vault</text>
    <text x="418" y="222" class="mono">~/skills/&lt;skill-id&gt;/SKILL.md</text>
    <text x="418" y="252" class="body">Install • scan • inspect • organize</text>
    <text x="774" y="252" text-anchor="end" class="mono">skillmux.toml</text>
  </g>

  <path d="M520 286 C520 330 318 322 318 364" fill="none" stroke="#34d399" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M680 286 C680 330 882 322 882 364" fill="none" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow-amber)"/>

  <g filter="url(#shadow)">
    <rect x="70" y="370" width="500" height="192" rx="18" fill="#111c2c" stroke="#10b981" stroke-width="2"/>
    <rect x="96" y="392" width="118" height="24" rx="12" fill="url(#native)"/>
    <text x="155" y="409" text-anchor="middle" class="chip">NATIVE PATH</text>
    <text x="96" y="451" class="subheading">Core and project skills</text>
    <text x="96" y="477" class="body">Select a small set with tier policy, then sync managed symlinks.</text>

    <rect x="96" y="498" width="130" height="38" rx="8" fill="#0b1321" stroke="#28533f"/>
    <text x="161" y="522" text-anchor="middle" class="mono">core ≤ 25</text>
    <rect x="238" y="498" width="130" height="38" rx="8" fill="#0b1321" stroke="#28533f"/>
    <text x="303" y="522" text-anchor="middle" class="mono">project groups</text>
    <rect x="380" y="498" width="162" height="38" rx="8" fill="#0b1321" stroke="#28533f"/>
    <text x="461" y="522" text-anchor="middle" class="mono">init • sync</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="370" width="500" height="192" rx="18" fill="#111c2c" stroke="#f59e0b" stroke-width="2"/>
    <rect x="656" y="392" width="122" height="24" rx="12" fill="url(#route)"/>
    <text x="717" y="409" text-anchor="middle" class="chip">ROUTED PATH</text>
    <text x="656" y="451" class="subheading">On-demand MCP retrieval</text>
    <text x="656" y="477" class="body">Search the long tail, return a shortlist, or deliver one verified skill.</text>

    <rect x="656" y="498" width="112" height="38" rx="8" fill="#0b1321" stroke="#674316"/>
    <text x="712" y="522" text-anchor="middle" class="mono">FTS5</text>
    <rect x="780" y="498" width="128" height="38" rx="8" fill="#0b1321" stroke="#674316"/>
    <text x="844" y="522" text-anchor="middle" class="mono">embeddings</text>
    <rect x="920" y="498" width="182" height="38" rx="8" fill="#0b1321" stroke="#674316"/>
    <text x="1011" y="522" text-anchor="middle" class="mono">optional reranker</text>
  </g>

  <g>
    <rect x="70" y="580" width="1060" height="2" fill="#243047"/>
    <text x="70" y="603" class="body">Native clients: Claude Code • Codex • Gemini CLI • OpenCode • GitHub Copilot • Windsurf • custom targets</text>
    <text x="1130" y="603" text-anchor="end" class="body">MCP: stdio or Streamable HTTP</text>
  </g>
</svg>
