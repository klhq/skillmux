# Configure remote inference endpoints. This describes where inference runs,
# not where Skillmux runs; local stdio and shared HTTP deployments can both use
# this file. The reranker section is optional.
# Keep the canonical vault separate from client skill directories.
vault_path = "~/skills"

# Optional: bounded recall and candidate reranking budgets.
# k_rerank bounds the maximum number of candidates passed to the reranker adapter.
# [recall]
# k_lexical = 20
# k_vector = 20
# k_rerank = 10

[inference]
mode = "remote"
timeout_ms = 5000

[inference.embedding]
provider = "openai"
endpoint = "https://embedding.example.com/v1/embeddings"
model = "your-embedding-model"
dimension = 1024
api_key_env = "EMBEDDING_API_KEY"

[inference.reranker]
adapter = "jina-v1"
endpoint = "https://reranker.example.com/v1/rerank"
model = "your-reranker-model"
api_key_env = "RERANKER_API_KEY"

# Optional: output configuration for resolve_skill ranked candidates.
# [output]
# top_k = 10
# max_top_k = 50
