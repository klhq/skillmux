# This file is optional. It configures the Skillmux CLI or the full Skillmux
# server image with local inference. Skillmux manages and indexes an
# agentskills.io-compatible canonical vault. Keep the vault separate from
# client skill directories such as ~/.agents/skills; skillmux sync selects
# which core and project skills appear in those directories.
vault_path = "~/skills"

# Optional: configuration authority policy. Defaults to true.
# When set to false, behavioral environment variables are ignored and TOML remains
# authoritative (CLI flags and secret names like api_key_env still resolve).
# [config]
# environment_overrides = true

# Optional, default []: machine-local override-only vaults, checked before
# vault_path for a given skill_id. Never holds skillmux.toml or the sync git
# hook — those always stay in vault_path. See docs/configuration.md#local-vault-overlays.
# local_vault_paths = ["~/skills-local"]

# Agents this machine syncs skills to. Each agent reads a fixed directory
# (claude-code: ~/.claude/skills, codex: $CODEX_HOME/skills, opencode,
# github-copilot, windsurf, goose and hermes: ~/.agents/skills, antigravity:
# ~/.gemini/config/skills), so you never name a directory. Defaults to [],
# which syncs nothing. See docs/configuration.md#agents.
# agents = ["claude-code", "opencode"]

# Optional: output configuration for resolve_skill ranked candidates.
# [output]
# top_k = 10
# max_top_k = 50
